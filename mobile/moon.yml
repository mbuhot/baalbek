# Capacitor wrapper over `web`'s built PWA, built by Gradle and xcodebuild as
# `system` tasks.
#
# Every task declares `toolchain: "system"`, and it is not redundant here as it
# was for timeline: dropped, all three become `node, pnpm` tasks.
#
# No `layer:` (stays `unknown`), same reason as core-api-client/moon.yml:
# `enforceLayerRelationships` forbids one `application` depending on another,
# and this is the deliberate application -> application edge onto `web`.
language: system

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/field-app-delivery"

dependsOn:
  - "web"

tasks:
  build-android:
    description: "Gradle build of the Capacitor Android project, producing an unsigned debug APK."
    # `MOBILE_API_BASE_URL` is not part of this task's hash: changing it needs
    # `--force`. See mobile/README.md.
    command: "bash scripts/build-android.sh"
    toolchain: "system"
    # `web:build` declares web/dist as its outputs, which `cap sync` consumes.
    deps:
      - "web:build"
    inputs:
      - "package.json"
      - "capacitor.config.ts"
      - "scripts/**/*"
      - "android/**/*"
    outputs:
      - "android/app/build/outputs/apk/debug/app-debug.apk"

  build-ios:
    description: "xcodebuild of the Capacitor iOS project (Debug, iphonesimulator SDK, unsigned)."
    # `requires-macos` is the one accepted toolchain-purity exception.
    # Three mechanisms keep it out of Linux runs, none weakening the Mac build:
    # this tag (read by scripts/build.sh), `runInCI: false`, and
    # scripts/build-ios.sh's own Darwin guard, which is what keeps the
    # untagged `moon check --all` green. See mobile/README.md.
    command: "bash scripts/build-ios.sh"
    toolchain: "system"
    tags:
      - "requires-macos"
    options:
      runInCI: false
    deps:
      - "web:build"
    inputs:
      - "package.json"
      - "capacitor.config.ts"
      - "ios/**/*"
    # `optional: true` — off macOS the script exits 0 and produces nothing.
    outputs:
      - glob: "ios/build/Build/Products/Debug-iphonesimulator/App.app/**/*"
        optional: true

  build:
    description: "Runs `build-android`, then every `requires-macos` task by tag."
    command: "bash scripts/build.sh"
    toolchain: "system"
    # Android has no accepted exception and runs everywhere, so this edge is
    # unconditional; scripts/build.sh finds the tagged tasks by query.
    deps:
      - "build-android"
