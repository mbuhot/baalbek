# Ash resources for invoices raised from completed jobs.
#
# Schema `billing` and role `billing`. `deps`, `build`, `test` and the
# `bootstrap` this one extends come from ../.moon/tasks/elixir.yml.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/invoicing"

tasks:
  bootstrap:
    extends: "bootstrap-repo"
    # `extends` copies `internal: true` with the rest; this project opts back in.
    options:
      internal: false

  build:
    inputs:
      - "priv/**/*"

  test:
    deps:
      - "~:bootstrap"
    inputs:
      - "priv/**/*"
