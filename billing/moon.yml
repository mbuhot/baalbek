# Stage 3 of PLAN.md: Ash resources, schema `billing` + role `billing`,
# boundary (via ash_boundary), ExUnit. Domain: invoices raised from completed
# jobs.
#
# `deps`, `build` and `test` come from ../.moon/tasks/elixir.yml; a declaration
# here merges into that one.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/invoicing"

tasks:
  bootstrap:
    description: >-
      Creates the `billing` Postgres role and schema (idempotent — see
      priv/repo/bootstrap.sql), then creates and migrates the test database.
      Requires a live Postgres (the `postgres` service in
      .devcontainer/docker-compose.yml).
    deps:
      - "~:deps"
    command: "bash"
    args:
      - "-lc"
      # One BEAM start serves the whole chain.
      - >-
        mix do billing.bootstrap +
        ecto.create --quiet +
        ecto.migrate --quiet
    toolchain: "system"
    env:
      MIX_ENV: "test"
      MIX_BUILD_PATH: "build/test"
    # Never cached: a warm cache against a fresh database would skip this.
    options:
      cache: false

  build:
    inputs:
      - "priv/**/*"

  test:
    deps:
      - "~:bootstrap"
    inputs:
      - "priv/**/*"
