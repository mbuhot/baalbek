# Stage 6 of PLAN.md: `server` release, OpenAPI generated from Ash, first real
# Mix path deps on sibling apps (`boundary`'s cross-app check turns on — see
# mix.exs). See server/README.md for why `server` bootstraps three schemas but
# has no Ecto Repo of its own.
#
# `deps`, `build` and `test` come from ../.moon/tasks/elixir.yml, and their
# `^:build` edge expands to the five Mix path deps moon-elixir-plugin infers
# from mix.exs. No task here names a dependency: `pricing` and `timeline` are
# reached through the facades that declare them, `pricing_native` and
# `timeline_facade`.
language: elixir
layer: application

# The shared cargo target directory pricing_native/moon.yml documents.
env:
  CARGO_TARGET_DIR: "$HOME/.cache/baalbek-cargo-target"

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/job-intake"
  - "capability/work-order-scheduling"
  - "capability/technician-availability"
  - "capability/account-access"
  - "capability/quote-pricing"
  - "capability/invoicing"
  - "capability/dispatch-board"
  - "capability/technician-work-queue"
  - "capability/api-contract"
  - "capability/release-assurance"

tasks:
  bootstrap:
    description: >-
      Creates `core`'s, `identity`'s and `billing`'s Postgres roles and
      schemas (idempotent — `server` boots all three as part of its dependency
      tree), then creates and migrates `core`'s test database, the one
      `server`'s own tests exercise. Requires a live Postgres (the `postgres`
      service in .devcontainer/docker-compose.yml).
    deps:
      - "~:deps"
    command: "bash"
    args:
      - "-lc"
      # One BEAM start serves the whole chain.
      - >-
        mix do core.bootstrap +
        identity.bootstrap +
        billing.bootstrap +
        ecto.create -r Core.Data.Repo --quiet +
        ecto.migrate -r Core.Data.Repo --quiet
    toolchain: "system"
    env:
      MIX_ENV: "test"
      MIX_BUILD_PATH: "build/test"
    # Never cached: a warm cache against a fresh database would skip this.
    options:
      cache: false

  test:
    description: >-
      Runs the ExUnit suite: real HTTP requests through `ServerWeb.Endpoint`
      against `core`'s JSON:API routes, and writes to the `timeline` schema
      from test/server_web/timeline_router_test.exs.
    deps:
      - "~:bootstrap"
      - "timeline:bootstrap"

  openapi:
    description: >-
      Generates `priv/static/openapi.json` from `Server.Api`'s
      `AshJsonApi.Domain` definition, in `~:build`'s dev tree. Boots the full
      `:server` application first, so it needs the same Postgres bootstrap as
      the suite even though spec generation never queries the database.
    deps:
      - "~:build"
      - "~:bootstrap"
    command: "bash"
    args:
      - "-lc"
      - >-
        mix openapi.spec.json --spec ServerWeb.JsonApiRouter --pretty=true priv/static/openapi.json
    toolchain: "system"
    env:
      MIX_ENV: "dev"
      MIX_BUILD_PATH: "build/dev"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"
    outputs:
      - "priv/static/openapi.json"

  release:
    description: >-
      Assembles the `MIX_ENV=prod` release into /.artifacts/server-release
      (PLAN.md Stage 6c), carrying its own ERTS and every application in
      `server`'s dependency tree, the Gleam ones included. Needs no database.
    # The one task that still fetches: the prod tree is its own, because the
    # plugin reads the dependency list at the default MIX_ENV, so there is no
    # prod list to compile and Mix has to check and build the tree itself.
    deps:
      - "~:deps"
      - "^:build"
    command: "bash"
    args:
      - "-lc"
      - >-
        export MIX_ENV=prod &&
        mix deps.get --only prod &&
        mix release --overwrite --path ../.artifacts/server-release
    toolchain: "system"
    # No `outputs`: nothing reads the tree, and it is 101 MB.
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"

  image:
    description: >-
      Builds the runnable release image Stage 9's e2e runs against
      (`baalbek-server:latest` by default; override with SERVER_IMAGE).
      Independent of `~:release`: server/Dockerfile compiles the release inside
      the image so the artifact never carries host paths. The build context is
      the workspace root, since the release assembles from sibling projects.
    deps:
      - "root:sandbox-image"
      - "^:build"
    command: "bash"
    args:
      - "-lc"
      - >-
        docker buildx build --builder default --load
        -f server/Dockerfile -t "${SERVER_IMAGE:-baalbek-server:latest}" .
    toolchain: "system"
    # Uncached: an image in the local daemon is not a file output.
    # `--builder default` shares the BuildKit cache root:sandbox-image writes.
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"
      - "/.prototools"
