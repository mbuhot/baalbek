# Stage 6 of PLAN.md: `server` release, OpenAPI generated from Ash, first
# real Mix path deps on sibling apps (`boundary`'s cross-app check turns
# on — see mix.exs). Task shape mirrors core/moon.yml's Postgres-bootstrap
# pattern; see server/README.md for why `server` bootstraps three schemas
# but has no Ecto Repo of its own.
language: elixir
layer: application

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/job-intake"
  - "capability/work-order-scheduling"
  - "capability/technician-availability"
  - "capability/account-access"
  - "capability/quote-pricing"
  - "capability/invoicing"
  - "capability/dispatch-board"
  - "capability/technician-work-queue"
  - "capability/api-contract"
  - "capability/release-assurance"

# The first five are the Elixir-to-Elixir slice of mix.exs's path deps,
# checked against this list by check-deps-drift.py; `pricing_native` and
# `timeline_facade` are themselves Elixir path deps of `server`, so they
# belong there too.
#
# `pricing` (Rust) and `timeline` (Gleam) are not Mix path deps and are
# correctly ignored by check-deps-drift.py's Mix-only comparison. They are
# declared here because this project's tasks name `timeline:package` as a
# task dependency, and because `moon ci` walks this list to decide what a
# `pricing` or `timeline` change affects.
dependsOn:
  - "core"
  - "identity"
  - "billing"
  - "pricing_native"
  - "timeline_facade"
  - "pricing"
  - "timeline"

tasks:
  test:
    description: >-
      Fetch Mix deps (pulling in all five domain apps as real path deps),
      bootstrap `core`'s, `identity`'s, and `billing`'s Postgres
      roles/schemas (idempotent — `server` boots all three as part of its
      dependency tree, per each app's own `Application.start/2`), create +
      migrate only `core`'s test database (the one `server`'s own tests
      exercise), then run the ExUnit suite: real HTTP requests through
      `ServerWeb.Endpoint` against `core`'s JSON:API routes. `CARGO_TARGET_DIR`
      is redirected for the same virtiofs reason documented in
      pricing_native/moon.yml — compiling `pricing_native` as a path dep of
      `server` hits the same rustc/virtiofs directory-creation race
      otherwise. Requires a live Postgres (the `postgres` service in
      .devcontainer/docker-compose.yml), including the `timeline` schema —
      test/server_web/timeline_router_test.exs writes to it, so
      `timeline:bootstrap` (uncached, like the three `mix *.bootstrap`
      calls below) is a dependency.
    # Every `*:build` entry declares `outputs`, so each one folds its own
    # hash — and, transitively, its own dependencies' — into this task's.
    # That is what makes a `pricing` crate or `timeline` Gleam change
    # invalidate this suite, through two levels of facade. See
    # ../spec/decisions/adr-0006-task-deps-on-output-declaring-tasks.md.
    deps:
      - "core:build"
      - "identity:build"
      - "billing:build"
      - "pricing_native:build"
      - "timeline_facade:build"
      - "timeline:bootstrap"
      - "timeline:package"
    command: "bash"
    args:
      - "-lc"
      - >-
        export CARGO_TARGET_DIR="$HOME/.cache/baalbek-cargo-target/pricing_native-native-pricingnative" &&
        mix deps.get &&
        mix core.bootstrap &&
        mix identity.bootstrap &&
        mix billing.bootstrap &&
        MIX_ENV=test mix ecto.create -r Core.Data.Repo --quiet &&
        MIX_ENV=test mix ecto.migrate -r Core.Data.Repo --quiet &&
        MIX_ENV=test mix test
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - "config/**/*"
      - "lib/**/*"
      - "spec/**/*"
      - "test/**/*"

  openapi:
    description: >-
      Generates `priv/static/openapi.json` from `Server.Api`'s
      `AshJsonApi.Domain` definition (PLAN.md "OpenAPI generated from
      Ash" / seed.md §6 "Runtime edges become build-time edges") — a
      build output a later `core-api-client` Moon task can declare as an
      input. Boots the full `:server` application first (so
      `ServerWeb.JsonApiRouter.spec/0` can introspect the compiled routes),
      hence the same Postgres bootstrap as the `test` task, even though
      spec generation itself never queries the database.
    deps:
      - "core:build"
      - "identity:build"
      - "billing:build"
      - "pricing_native:build"
      - "timeline_facade:build"
      - "timeline:package"
    command: "bash"
    args:
      - "-lc"
      - >-
        export CARGO_TARGET_DIR="$HOME/.cache/baalbek-cargo-target/pricing_native-native-pricingnative" &&
        mix deps.get &&
        mix core.bootstrap &&
        mix identity.bootstrap &&
        mix billing.bootstrap &&
        mix openapi.spec.json --spec ServerWeb.JsonApiRouter --pretty=true priv/static/openapi.json
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"
    outputs:
      - "priv/static/openapi.json"

  release:
    description: >-
      Assembles the `MIX_ENV=prod` release (PLAN.md Stage 6c). The release
      carries its own ERTS and every application in `server`'s dependency
      tree, the Gleam ones included — `timeline` and its runtime
      dependencies reach it as Mix path deps of `timeline_facade`, which is
      why `timeline:package` runs first. No database needed: `mix release`
      compiles and assembles, it never boots the app. Configuration is read
      from the environment at boot by config/runtime.exs.

      The release is written to /.artifacts/server-release and declares no
      `outputs`. Nothing consumes the artifact — `server:image` compiles
      its own release inside the Docker build stage — so there is no edge
      for outputs to carry, and a 101 MB tree is not worth archiving into
      the Moon cache on every miss.
    deps:
      - "core:build"
      - "identity:build"
      - "billing:build"
      - "pricing_native:build"
      - "timeline_facade:build"
      - "timeline:package"
    command: "bash"
    args:
      - "-lc"
      - >-
        export CARGO_TARGET_DIR="$HOME/.cache/baalbek-cargo-target/pricing_native-native-pricingnative-prod" &&
        export MIX_ENV=prod &&
        mix deps.get --only prod &&
        mix release --overwrite --path ../.artifacts/server-release
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"

  image:
    description: >-
      Builds the runnable release image Stage 9's e2e runs against
      (`baalbek-server:latest` by default; override with SERVER_IMAGE).
      Independent of the `release` task: Dockerfile compiles the release
      inside the image so the artifact never carries host paths. Build
      context is the workspace root, since the release assembles from
      sibling projects.

      Uncached deliberately: an image in the local daemon is not a file
      output, so a Moon cache hit replays a log claiming the image was
      built while a `docker image prune` has since removed it. Docker's own
      layer cache keeps the real rebuild to a couple of seconds.
    deps:
      - "root:sandbox-image"
      - "core:build"
      - "identity:build"
      - "billing:build"
      - "pricing_native:build"
      - "timeline_facade:build"
    command: "bash"
    args:
      - "-lc"
      - >-
        docker build -f server/Dockerfile -t "${SERVER_IMAGE:-baalbek-server:latest}" .
    toolchain: "system"
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"
      - "/.prototools"
