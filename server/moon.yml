# The Phoenix application: JSON:API over `core`, `identity` and `billing`, plus
# the release and the OpenAPI document generated from it.
#
# No task here names a dependency: the inherited `^:build` edge expands to the
# five Mix path deps moon-elixir-plugin infers from mix.exs. server/README.md
# says why `server` bootstraps three schemas but owns no Ecto Repo.
language: elixir
layer: application

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/job-intake"
  - "capability/work-order-scheduling"
  - "capability/technician-availability"
  - "capability/account-access"
  - "capability/quote-pricing"
  - "capability/invoicing"
  - "capability/dispatch-board"
  - "capability/technician-work-queue"
  - "capability/api-contract"
  - "capability/release-assurance"

tasks:
  # Compiling any of server's three build trees runs Rustler, so each task
  # below is serialised against every other cargo task; adr-0014 says why.
  # `build` itself is inherited from ../.moon/tasks/elixir.yml.
  build:
    options:
      mutex: "cargo-target-dir"

  bootstrap:
    description: "Creates `core`'s, `identity`'s and `billing`'s Postgres roles and schemas, then creates and migrates `core`'s test database."
    # Declared here, not inherited: three schemas, and the repo is `core`'s.
    # Requires a live Postgres (the `postgres` service in
    # ../.devcontainer/docker-compose.yml).
    deps:
      - "~:deps"
      # server's own suite writes to the `timeline` schema from
      # test/server_web/timeline_router_test.exs, so preparing the database
      # for it means preparing that schema too.
      - "timeline:bootstrap"
    command: "bash"
    args:
      - "-lc"
      - "mix bootstrap"
    toolchain: "system"
    env:
      MIX_ENV: "test"
      MIX_BUILD_PATH: "build/test"
    # Never cached: a warm cache against a fresh database would skip this.
    options:
      mutex: "cargo-target-dir"
      cache: false

  test:
    description: "Runs the ExUnit suite: real HTTP requests through `ServerWeb.Endpoint` against `core`'s JSON:API routes."
    deps:
      - "~:bootstrap"
    options:
      mutex: "cargo-target-dir"

  openapi:
    description: "Generates `priv/static/openapi.json` from the mounted JSON:API router."
    # `~:bootstrap` because spec generation boots the whole `:server`
    # application, not because it queries the database.
    deps:
      - "~:build"
      - "~:bootstrap"
    command: "bash"
    args:
      - "-lc"
      - "mix openapi"
    toolchain: "system"
    env:
      MIX_ENV: "dev"
      MIX_BUILD_PATH: "build/dev"
    inputs:
      - "@group(sources)"
    outputs:
      - "priv/static/openapi.json"
    options:
      mutex: "cargo-target-dir"

  release:
    description: "Assembles the `MIX_ENV=prod` release into /.artifacts/server-release, carrying its own ERTS."
    deps:
      - "~:deps"
      - "^:build"
    command: "bash"
    args:
      - "-lc"
      - "mix release.artifact"
    toolchain: "system"
    env:
      MIX_ENV: "prod"
    # No `outputs`: nothing reads the tree, and it is 101 MB.
    inputs:
      - "@group(sources)"
    options:
      mutex: "cargo-target-dir"

  image:
    description: "Builds the runnable release image the e2e suite runs against (`baalbek-server:latest`, or `$SERVER_IMAGE`)."
    # Independent of `~:release`: server/Dockerfile compiles the release inside
    # the image, so the artifact never carries host paths.
    deps:
      - "root:sandbox-image"
      - "^:build"
    script: >-
      docker buildx build --builder default --load
      -f server/Dockerfile -t "${SERVER_IMAGE:-baalbek-server:latest}" .
    toolchain: "system"
    # Uncached: an image in the local daemon is not a file output.
    # `--builder default` shares the BuildKit cache root:sandbox-image writes.
    # The context is the workspace root: the release assembles from siblings.
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "@group(sources)"
      - "/.prototools"
