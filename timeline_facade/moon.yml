# Cross-language edge: timeline is a Gleam project, not a Mix path dep.
# check-deps-drift.py correctly ignores it (Mix-to-Mix only).
language: elixir
layer: library

dependsOn:
  - "timeline"

tasks:
  test:
    description: >-
      Runs the ExUnit suite against timeline's compiled Gleam output.
      Also runs a compensating check standing in for boundary, which
      cannot classify Gleam's bare-atom modules (see
      spec/decisions/adr-0001-gleam-elixir-interop.md).
    command: "bash"
    args:
      - "scripts/moon-test.sh"
    # Project-level dependsOn alone does not force timeline:test to run
    # before this task for a direct `moon run timeline_facade:test`; only
    # a task-level dep does (verified in Stage 5). `timeline:package` is
    # not optional: this project's mix.exs reads ../timeline/build/otp to
    # build its dependency list, and raises if that directory is missing.
    deps:
      - "timeline:test"
      - "timeline:package"
      # Uncached, so a warm Moon cache against a fresh database still
      # creates the schema this suite writes to.
      - "timeline:bootstrap"
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - "lib/**/*"
      - "test/**/*"
      - "scripts/moon-test.sh"
      # `timeline` is a Gleam project, not a Mix path dep, so Moon sees no
      # file glob for it under this project's directory. `deps:
      # [timeline:test]` above is a *sequencing* edge only — that task
      # declares no `outputs`, so it contributes nothing to this task's
      # hash (the same rule pricing_native/moon.yml documents). Without
      # these inputs a Gleam source change left this task on a cache hit,
      # replaying a stale pass. See
      # ../spec/decisions/adr-0002-cross-language-edges-need-project-inputs.md.
      #
      # Timeline's *sources*, not `project://timeline`: a whole-project
      # input makes Moon walk timeline/build while `timeline:package` is
      # deleting and rewriting it.
      - "/timeline/gleam.toml"
      - "/timeline/manifest.toml"
      - "/timeline/src/**/*"
      - "/timeline/scripts/**/*"
