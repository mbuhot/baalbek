# Stage 5 of PLAN.md: the sole caller of the Gleam `timeline` modules.
#
# No task here names the `timeline` edge: this app's mix.exs takes one path dep
# per application under ../timeline/build/otp, moon-elixir-plugin resolves
# those onto the `timeline` project, and the inherited `^:build` turns that
# into an edge onto `timeline:build`.
#
# `deps`, `build` and `test` come from ../.moon/tasks/elixir.yml.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/technician-availability"

tasks:
  boundary-check:
    description: >-
      Fails on a direct `:timeline.` call outside TimelineFacade.Gleam, which
      `boundary` cannot enforce over Gleam's bare-atom modules. See
      spec/decisions/adr-0001-gleam-elixir-interop.md.
    command: "bash"
    args:
      - "scripts/boundary-check.sh"
    toolchain: "system"
    inputs:
      - "lib/**/*"
      - "scripts/boundary-check.sh"

  test:
    deps:
      # Uncached, so a warm Moon cache against a fresh database still creates
      # the schema this suite writes to.
      - "timeline:bootstrap"
      - "~:boundary-check"
