# The edge onto `timeline` is NOT declared here. This app's mix.exs builds its
# dependency list by listing ../timeline/build/otp at Mix-evaluation time, and
# moon-elixir-plugin asks Mix rather than parsing the file, so it resolves
# those path deps onto the `timeline` project. Before ../timeline:package has
# run the manifest raises, the plugin warns and infers nothing, and the edge
# falls back to this project's `deps` on `timeline:package` — affected
# detection is identical either way. See
# ../moon-elixir-plugin/spec/decisions/adr-0001-mix-path-dep-inference.md.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/technician-availability"

tasks:
  build:
    description: >-
      Compiles this app against timeline's packaged OTP applications, into
      the Moon-owned `build/` tree. Declared as this project's artefact so
      `server`'s tasks can express the edge onto it, and onto the Gleam
      source behind it, as a single `deps` entry. Same shape as
      core/moon.yml's `build` task; see
      ../spec/decisions/adr-0006-task-deps-on-output-declaring-tasks.md.
    deps:
      - "timeline:package"
    command: "bash"
    args:
      - "-lc"
      - "mix deps.get && mix compile"
    toolchain: "system"
    env:
      MIX_ENV: "dev"
      MIX_BUILD_PATH: "build"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "lib/**/*"
    outputs:
      - "build/lib/timeline_facade/ebin"

  test:
    description: >-
      Runs the ExUnit suite against timeline's compiled Gleam output.
      Also runs a compensating check standing in for boundary, which
      cannot classify Gleam's bare-atom modules (see
      spec/decisions/adr-0001-gleam-elixir-interop.md).
    command: "bash"
    args:
      - "scripts/moon-test.sh"
    # `timeline:package` declares `outputs`, so it both orders the Gleam
    # build before this suite and folds the Gleam sources into this task's
    # hash. It is not optional either way: this project's mix.exs reads
    # ../timeline/build/otp to build its dependency list, and raises if
    # that directory is missing.
    deps:
      - "timeline:package"
      # Uncached, so a warm Moon cache against a fresh database still
      # creates the schema this suite writes to.
      - "timeline:bootstrap"
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - "lib/**/*"
      - "test/**/*"
      - "scripts/moon-test.sh"
