# The sole caller of the Gleam `timeline` modules.
#
# No task names the `timeline` edge: mix.exs takes one path dep per application
# under ../timeline/build/otp, moon-elixir-plugin resolves those onto the
# `timeline` project, and the inherited `^:build` turns that into an edge.
# `deps`, `build` and `test` come from ../.moon/tasks/elixir.yml.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/technician-availability"

tasks:
  boundary-check:
    description: "Fails on a direct `:timeline.` call outside TimelineFacade.Gleam."
    # `boundary` cannot enforce this over Gleam's bare-atom modules. See
    # spec/decisions/adr-0001-gleam-elixir-interop.md.
    command: "bash scripts/boundary-check.sh"
    toolchain: "system"
    inputs:
      - "lib/**/*"
      - "scripts/boundary-check.sh"

  test:
    deps:
      # Uncached, so a warm Moon cache against a fresh database still creates
      # the schema this suite writes to.
      - "timeline:bootstrap"
      - "~:boundary-check"
