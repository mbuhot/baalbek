# Stage 5 of PLAN.md: the sole caller of the Gleam `timeline` modules.
#
# No task here names the `timeline` edge: this app's mix.exs lists
# ../timeline/build/otp at Mix-evaluation time, moon-elixir-plugin resolves
# those path deps onto the `timeline` project, and the inherited `^:build`
# turns that into an edge onto `timeline:build`.
#
# `deps`, `build` and `test` come from ../.moon/tasks/elixir.yml.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/technician-availability"

tasks:
  boundary-check:
    description: >-
      Fails on a direct `:timeline.` call outside TimelineFacade.Gleam, which
      `boundary` cannot enforce over Gleam's bare-atom modules. See
      spec/decisions/adr-0001-gleam-elixir-interop.md.
    command: "bash"
    args:
      - "scripts/boundary-check.sh"
    toolchain: "system"
    inputs:
      - "lib/**/*"
      - "scripts/boundary-check.sh"

  # `$MIX_PATH_DEPS` cannot be complete for this project: the plugin evaluates
  # mix.exs before `timeline:build` writes ../timeline/build/otp, so on a cold
  # tree the manifest lists one application where the shipment holds eleven.
  # Both tasks below therefore let Mix run its own dependency check, which
  # links all eleven. This project locks no git dependency, so that check has
  # nothing it could re-clone. See ../spec/decisions/adr-0010-third-party-deps-compile-in-their-own-task.md.
  build:
    env:
      MIX_DEPS_CHECK: ""

  test:
    deps:
      # Uncached, so a warm Moon cache against a fresh database still creates
      # the schema this suite writes to.
      - "timeline:bootstrap"
      - "~:boundary-check"
    env:
      MIX_DEPS_CHECK: ""
