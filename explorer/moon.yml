# Stage 10 of PLAN.md: the architecture explorer (seed.md §9). A static site
# generated from the moon graph, git history, the e2e suite, and capabilities.yml.
language: typescript

# No `layer:` (stays `unknown`) — this project reads `e2e:list`, and moon's
# `enforceLayerRelationships` forbids a `tool` depending on an `automation`.
# An unknown layer scopes the exemption to explorer's own edges, rather than
# relaxing the constraint workspace-wide. Same device as core-api-client's.
dependsOn:
  - "e2e"

# `e2e` is a source of data, not of types: this project imports nothing from it
# and only reads `e2e:list`'s JSON, so a synced project reference is one `tsc`
# refuses to compile — e2e's tsconfig is `noEmit` and not `composite`.
toolchains:
  typescript:
    syncProjectReferences: false

# Carries no business capability; explorer/capabilities.yml records why.
tags:
  - "platform"

tasks:
  generate:
    description: >-
      Rebuilds src/generated/model.json from `moon project-graph --json`,
      `moon task-graph --json`, `e2e:list`'s test list, `git log`, and
      capabilities.yml. Fails when a project or an e2e spec claims a
      capability the vocabulary does not define, and when a project claims
      nothing at all.

      The capability coverage comes through a `deps` entry on `e2e:list`,
      which declares its JSON as an output — so the edge is hashed the way
      every other cross-project edge in this workspace is, and nothing here
      reaches into e2e's tree (../spec/decisions/adr-0006-*).

      The moon.yml and spec/ globs are the exception, and they are named
      files this task genuinely reads: the project graph is nothing but the
      moon.yml files, and the spec links are the tracked files under each
      spec/. No directory is walked, no build tree is reachable, no task
      writes any of them, and there is no artefact to depend on instead.

      Uncached deliberately. Git history is a real input, and Moon can hash
      only files; a cached run would serve change-frequency data from
      whenever the cache was filled. See spec/decisions/adr-0004-*.
    command: "bash"
    args:
      - "-lc"
      - "pnpm install --frozen-lockfile && pnpm run generate"
    deps:
      - "e2e:list"
    toolchain: "node"
    options:
      cache: false
    inputs:
      - "package.json"
      - "capabilities.yml"
      - "src/model.ts"
      - "src/generate/**/*"
      - "/.moon/*.yml"
      - "/*/moon.yml"
      - "/moon.yml"
      - "/*/spec/**/*"
      - "/spec/**/*"
    outputs:
      - "src/generated/model.json"

  build:
    description: >-
      Type-checks the generator and the site, then bundles the static site
      into dist. The model is bundled rather than fetched, so serving dist
      needs a static file server and nothing else.

      Uncached for the same reason `generate` is: it consumes `generate`'s
      output, which is gitignored and so is not hashable as an input, and
      whose content moves with git history. seed.md §9 asks for a site
      regenerated on every build so it cannot drift; this is that, literally.
    command: "bash"
    args:
      - "-lc"
      - "pnpm install --frozen-lockfile && pnpm run build"
    deps:
      - "generate"
    toolchain: "node"
    options:
      cache: false
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - "src/**/*"
    outputs:
      - "dist"

  test:
    description: >-
      Runs the vitest suite. `deps` on `build` makes this gate type-check as
      well: vitest transforms TypeScript with esbuild, which strips types
      and never checks them — the same reason web:test depends on web:build,
      recorded in web/spec/decisions/adr-0001-vitest-does-not-type-check.md.
      `build` also produces src/generated/model.json, which
      src/generated-model.test.ts asserts against.
    command: "bash"
    args:
      - "-lc"
      - "pnpm install --frozen-lockfile && pnpm run test"
    deps:
      - "build"
    toolchain: "node"
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "capabilities.yml"
      - "src/**/*"
