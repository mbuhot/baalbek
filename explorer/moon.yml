# Stage 10 of PLAN.md: the architecture explorer (seed.md §9). A static site
# generated from the moon graph, git history, the e2e suite, and capabilities.yml.
language: typescript

# No `layer:` (stays `unknown`) — this project reads `e2e:list`, and moon's
# `enforceLayerRelationships` forbids a `tool` depending on an `automation`.
# An unknown layer scopes the exemption to explorer's own edges, rather than
# relaxing the constraint workspace-wide. Same device as core-api-client's.
dependsOn:
  - "e2e"

# `e2e` is a source of data, not of types: this project imports nothing from it
# and only reads `e2e:list`'s JSON, so a synced project reference is one `tsc`
# refuses to compile — e2e's tsconfig is `noEmit` and not `composite`.
toolchains:
  typescript:
    syncProjectReferences: false

# Carries no business capability; explorer/capabilities.yml records why.
tags:
  - "platform"

fileGroups:
  site:
    - "package.json"
    - "tsconfig.json"
    - "vite.config.ts"
    - "src/**/*"

tasks:
  generate:
    description: "Rebuilds src/generated/model.json from the moon graph, `e2e:list`'s test list, git history, and capabilities.yml."
    script: "pnpm run generate"
    deps:
      - "~:install"
      - "e2e:list"
    # Uncached: git history is a real input, and moon can hash only files
    # (spec/decisions/adr-0004-*).
    options:
      cache: false
    inputs:
      - "package.json"
      - "capabilities.yml"
      - "src/model.ts"
      - "src/generate/**/*"
      - "/.moon/*.yml"
      - "/*/moon.yml"
      - "/moon.yml"
      - "/*/spec/**/*"
      - "/spec/**/*"
    outputs:
      - "src/generated/model.json"

  build:
    description: "Type-checks the generator and the site, then bundles the site and its model into dist."
    script: "pnpm run build"
    deps:
      - "~:install"
      - "generate"
    # Uncached: it consumes `generate`'s gitignored output, which is not
    # hashable as an input.
    options:
      cache: false
    inputs:
      - "@group(site)"
      - "index.html"
    outputs:
      - "dist"

  test:
    description: "Runs the vitest suite."
    # `deps` on `build` is what type-checks this gate, and what writes the
    # model src/generated-model.test.ts asserts against.
    script: "pnpm run test"
    deps:
      - "~:install"
      - "build"
    inputs:
      - "@group(site)"
      - "capabilities.yml"
