# Root pseudo-project (source ".") — repo-wide tooling, not a component
# from PLAN.md's Component inventory table.
#
# Holds the two repo-wide convention checks — the dependsOn drift-check
# (seed.md §2 fallback; superseded by moon-elixir-plugin in Stage 11) and the
# lib/<area> -> test/<area> mirroring check (seed.md §7.3) — and gives
# `moon check --all` at least one task to run at Stage 1, when no other
# project has real tasks yet. See .moon/workspace.yml's header comment for
# why that's necessary.
language: bash
layer: tool

tasks:
  check-deps-drift:
    description: "Diff declared moon.yml dependsOn against mix.exs path deps for every Elixir app (seed.md §2 fallback)."
    command: "python3 check-deps-drift.py"
    toolchain: "system"
    inputs:
      - "check-deps-drift.py"
      - "*/mix.exs"
      - "*/moon.yml"

  # Named `test`, not `check-test-paths`, so `moon run :test` (PLAN.md's
  # Stage 8 gate) sweeps up the repo-wide convention checks alongside every
  # project's own suite. `boundary` cannot see the test tree, so this
  # convention is all that holds the within-app mapping honest.
  test:
    description: "Check the lib/<area> -> test/<area> mirroring every Elixir app's `mix test.changed` selects from (seed.md §7.3)."
    command: "python3 test-paths.py --check"
    toolchain: "system"
    deps:
      - "~:check-deps-drift"
    inputs:
      - "test-paths.py"
      - "*/lib/**/*.ex"
      - "*/test/**/*_test.exs"

  sandbox-image:
    description: >-
      Builds the sandbox/CI image (PLAN.md "Sandbox"). Also the build stage
      of server/Dockerfile, so `server:image` depends on this rather than
      redeclaring the toolchain. Docker's own layer cache makes a rebuild
      with nothing changed cheap; Moon caches nothing here, since an image
      in the local daemon is not a file output.
    command: "bash"
    args:
      - "-lc"
      - >-
        docker build -t "${SANDBOX_IMAGE:-baalbek-sandbox:latest}" -f Dockerfile .
    toolchain: "system"
    inputs:
      - "Dockerfile"
      - ".prototools"
