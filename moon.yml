# Root pseudo-project (source ".") — repo-wide tooling, not a component
# from PLAN.md's Component inventory table.
#
# Holds the lib/<area> -> test/<area> mirroring check (seed.md §7.3), and
# gives `moon check --all` at least one task to run at Stage 1, when no other
# project has real tasks yet. See .moon/workspace.yml's header comment for
# why that's necessary.
language: bash
layer: tool

# Carries no business capability; explorer/capabilities.yml records why.
tags:
  - "platform"

tasks:
  # Named `test`, not `check-test-paths`, so `moon run :test` (PLAN.md's
  # Stage 8 gate) sweeps up this repo-wide convention check alongside every
  # project's own suite. `boundary` cannot see the test tree, so this
  # convention is all that holds the within-app mapping honest.
  test:
    description: "Check the lib/<area> -> test/<area> mirroring every Elixir app's `mix test.changed` selects from (seed.md §7.3)."
    command: "python3 test-paths.py --check"
    toolchain: "system"
    inputs:
      - "test-paths.py"
      - "*/lib/**/*.ex"
      - "*/test/**/*_test.exs"

  sandbox-image:
    description: >-
      Builds the sandbox/CI image (PLAN.md "Sandbox"). Also the build stage
      of server/Dockerfile, so `server:image` depends on this rather than
      redeclaring the toolchain.

      Uncached deliberately. Moon would happily cache this task on its
      inputs, and a cache hit replays a log claiming the image was built
      while `docker image prune` has since removed it — a task reporting
      success and producing nothing. Docker's own layer cache makes the
      real rebuild cheap, which is what makes the flag nearly free.

      `buildx build`, not `build`, in all three image tasks: without the
      Buildx plugin `docker build` degrades to the legacy builder behind a
      deprecation warning, and the legacy builder shares no cache with the
      daemon's BuildKit — this task then recompiles Erlang/OTP from source.
      Naming buildx turns that into an error instead.
    command: "bash"
    args:
      - "-lc"
      - >-
        docker buildx build -t "${SANDBOX_IMAGE:-baalbek-sandbox:latest}" -f Dockerfile .
    toolchain: "system"
    options:
      cache: false
    inputs:
      - "Dockerfile"
      - ".dockerignore"
      - ".prototools"
