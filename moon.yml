# Repo-wide tooling for the root pseudo-project (source "."), not a component
# from PLAN.md's inventory.
#
# Both tasks declare `toolchain: "system"`, and it is not redundant here as it
# was for timeline: dropped, both become `node, pnpm` tasks.
language: bash
layer: tool

# Carries no business capability; explorer/capabilities.yml records why.
tags:
  - "platform"

tasks:
  # Named `test`, not `check-build-dirs`, so `moon run :test` sweeps it up.
  test:
    description: "Checks the devcontainer mounts a volume over every directory the build writes into."
    command: "bash scripts/mount-build-dirs.sh check-devcontainer"
    toolchain: "system"
    inputs:
      - "scripts/mount-build-dirs.sh"
      - ".devcontainer/docker-compose.yml"
      # The derived list follows these, so a new project changes the answer.
      - "*/mix.exs"
      - "*/gleam.toml"
      - "*/Cargo.toml"
      - "*/package.json"

  sandbox-image:
    description: "Builds the sandbox/CI image, which is also server/Dockerfile's build stage."
    # `buildx build`, not `build`: without the Buildx plugin `docker build` falls
    # back to a legacy builder that shares no cache and recompiles OTP.
    # `--builder default` pins the daemon's own BuildKit, the cache CI writes.
    script: >-
      docker buildx build --builder default --load
      -t "${SANDBOX_IMAGE:-baalbek-sandbox:latest}" -f Dockerfile .
    toolchain: "system"
    options:
      # An image in the local daemon is not a file output, so a cache hit would
      # replay a log for an image `docker image prune` has since removed.
      cache: false
    # Also reached by .moon/tasks/all.yml's implicitInputs, but declared here
    # too: this is the task that builds them, not just one that runs on them.
    inputs:
      - "Dockerfile"
      - ".dockerignore"
      - ".prototools"
