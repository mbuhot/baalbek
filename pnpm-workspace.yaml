# pnpm workspace members. Explicit paths, not a glob — the Elixir/Rust/Gleam
# project directories have no package.json and must never be swept in.
#
# No root package.json: this file alone is sufficient for pnpm to detect the
# workspace root — verified empirically (`pnpm install`, `pnpm --filter web
# run test`, and every `moon run`/`moon check --all` task all work with no
# package.json here) — so no placeholder file is kept just to hold one.
packages:
  - "web"
  - "core-api-client"
  - "mobile"
  - "e2e"
  - "explorer"

# msw isn't a direct dependency here (web/src/test/mockFetch.ts stubs fetch
# directly instead — see web/README.md) but vitest's own @vitest/mocker
# pulls it in as an optional peer; its postinstall only copies an unused
# browser service-worker shim, so it's harmless to allow.
allowBuilds:
  msw: true
