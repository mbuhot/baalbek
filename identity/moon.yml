# Stage 3 of PLAN.md: Ash resources, schema `identity` + role `identity`,
# boundary (via ash_boundary), ExUnit. Domain: technicians, dispatchers,
# auth. Task shape mirrors core/moon.yml exactly (see that file's comment
# for the full rationale) — just renamed core -> identity.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/account-access"

tasks:
  build:
    description: >-
      Compiles the app into `build/lib/identity/ebin` — same shape and
      rationale as core/moon.yml's `build` task.
    command: "bash"
    args:
      - "-lc"
      - "mix deps.get && mix compile"
    toolchain: "system"
    env:
      MIX_ENV: "dev"
      MIX_BUILD_PATH: "build"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"
      - "priv/**/*"
    outputs:
      - "build/lib/identity/ebin"

  test:
    description: >-
      Fetch Mix deps, bootstrap the `identity` Postgres role/schema
      (idempotent — see priv/repo/bootstrap.sql), create+migrate the test
      database, then run the ExUnit suite. Elixir isn't a Moon-native
      toolchain yet (Stage 11 adds moon-elixir-plugin), so this is
      declared as a `system` task that shells out to `mix`, resolved via
      proto's PATH activation (assumed already on PATH — proto/moon are
      set up in Stage 0). Requires a live Postgres (the `postgres` service
      in .devcontainer/docker-compose.yml) reachable with the connection
      details in config/config.exs / lib/mix/tasks/identity.bootstrap.ex's
      defaults.
    command: "bash"
    args:
      - "-lc"
      - >-
        mix deps.get &&
        mix identity.bootstrap &&
        MIX_ENV=test mix ecto.create --quiet &&
        MIX_ENV=test mix ecto.migrate --quiet &&
        MIX_ENV=test mix test
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - "config/**/*"
      - "lib/**/*"
      - "priv/**/*"
      - "spec/**/*"
      - "test/**/*"
