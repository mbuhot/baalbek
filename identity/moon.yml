# Stage 3 of PLAN.md: Ash resources, schema `identity` + role `identity`,
# boundary (via ash_boundary), ExUnit. Domain: technicians, dispatchers, auth.
#
# `deps`, `build` and `test` come from ../.moon/tasks/elixir.yml; a declaration
# here merges into that one.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/account-access"

tasks:
  bootstrap:
    description: >-
      Creates the `identity` Postgres role and schema (idempotent — see
      priv/repo/bootstrap.sql), then creates and migrates the test database.
      Requires a live Postgres (the `postgres` service in
      .devcontainer/docker-compose.yml).
    deps:
      - "~:deps"
    extends: "deps-list"
    command: "bash"
    args:
      - "-lc"
      # One `loadpaths --no-deps-check` covers the three tasks after it, and
      # one BEAM start serves all four.
      - >-
        { test -z "$MIX_PATH_DEPS" || mix deps.compile $MIX_PATH_DEPS; } &&
        mix do loadpaths --no-deps-check +
        identity.bootstrap +
        ecto.create --quiet +
        ecto.migrate --quiet
    toolchain: "system"
    env:
      MIX_ENV: "test"
      MIX_BUILD_PATH: "build/test"
    # Never cached: a warm cache against a fresh database would skip this.
    options:
      cache: false

  build:
    inputs:
      - "priv/**/*"

  test:
    deps:
      - "~:bootstrap"
    inputs:
      - "priv/**/*"
