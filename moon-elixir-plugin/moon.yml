# The WASM toolchain plugin that asks Mix for each Elixir project's dependency
# list and infers `dependsOn` from its path deps; ../.moon/toolchains.yml loads
# it as the `elixir` toolchain.
#
# This project declares no input, dependsOn, or test expectation outside its
# own directory, so copying the directory into an empty repository loses
# nothing.
language: rust
layer: tool

# Carries no business capability; explorer/capabilities.yml records why.
tags:
  - "platform"

# Must equal the value scripts/build.sh exports: moon's plugin test harness
# resolves the wasm artifact under $CARGO_TARGET_DIR/wasm32-wasip1.
env:
  CARGO_TARGET_DIR: "$HOME/.cache/baalbek-cargo-target/moon-elixir-plugin"

tasks:
  fmt:
    description: "Fails on a formatting difference `cargo fmt` would make."
    script: "cargo fmt --check"
    toolchain: "rust"
    inputs:
      - "src/**/*"
      - "tests/**/*"

  build:
    description: "Compiles the plugin and checks the committed artifact came from this source."
    command: "bash scripts/build.sh"
    toolchain: "rust"
    # Equal to SOURCE_PATHS in scripts/provenance.sh, which fingerprints them:
    # an input listed here and not there lets a stale artifact pass.
    inputs:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
      - "scripts/**/*"
    outputs:
      - "plugin/moon_elixir_plugin.wasm"

  test:
    description: "Runs the crate's suite against tests/__fixtures__, wasm artifact included."
    # `~:build` produces the wasm the integration tests load.
    deps:
      - "~:build"
      - "~:fmt"
    # `bash -lc`, unlike every other task here: the plugin runs `elixir`, and
    # only a login shell puts proto's working ~/.proto/bin ahead of the asdf
    # shims, which cannot locate an asdf-backed Erlang (adr-0007, adr-0009).
    # `--no-default-features` turns off `wasm`, so the rule runs as plain Rust.
    command: "bash"
    args:
      - "-lc"
      - "cargo test --no-default-features"
    toolchain: "rust"
    inputs:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
      - "tests/**/*"
