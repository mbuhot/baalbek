# Stage 11 of PLAN.md: the WASM toolchain plugin that asks Mix for each Elixir
# project's dependency list and infers `dependsOn` from its path deps. Wired
# into ../.moon/toolchains.yml as the `elixir` toolchain; see
# spec/decisions/adr-0001-mix-path-dep-inference.md.
#
# This project declares no input, dependsOn, or test expectation outside its
# own directory: seed.md:161 says it may live in its own repo, so copying the
# directory into an empty repository must lose nothing.
language: rust
layer: tool

# Carries no business capability; explorer/capabilities.yml records why.
tags:
  - "platform"

tasks:
  build:
    description: >-
      Compiles the plugin to `plugin/moon_elixir_plugin.wasm`, the artifact
      ../.moon/toolchains.yml loads.

      That artifact is committed, unlike every other project's build output.
      Moon reads the WASM file while it builds the project graph, so a
      missing file fails every moon command — this one included. The new
      artifact is written beside the old one and renamed over it, so a failed
      compile leaves the loadable file in place rather than truncating it.

      The `git diff --exit-code -- plugin/` that follows is what makes a stale
      commit impossible: neither `git status` nor moon's own output reveals
      one on its own, because an artifact nobody rebuilt leaves a clean tree
      and a rebuilt one does not change what moon reports until the
      project-graph cache is invalidated by a manifest change. Failing this
      task is the only place the divergence is visible.

      CARGO_TARGET_DIR is redirected under $HOME for the virtiofs reason
      ../pricing/moon.yml documents, spelled out twice because Moon
      substitutes `$CARGO_TARGET_DIR` from its own environment and would
      expand it to empty, and `cat` rather than `cp` for the reflink reason
      that file documents too. The wasm32-wasip1 target comes from
      the rustup that proto's rust plugin installs, added on demand rather
      than baked into the sandbox image so the OTP layer stays cached
      (PLAN.md "Adding OS packages after the fact").
    command: "bash"
    args:
      - "-lc"
      - >-
        export CARGO_TARGET_DIR="$HOME/.cache/baalbek-cargo-target/moon-elixir-plugin" &&
        if ! rustup target list --installed | grep -qx wasm32-wasip1;
        then rustup target add wasm32-wasip1; fi &&
        cargo build --target wasm32-wasip1 --release &&
        mkdir -p plugin &&
        cat "$HOME/.cache/baalbek-cargo-target/moon-elixir-plugin/wasm32-wasip1/release/moon_elixir_plugin.wasm"
        > plugin/moon_elixir_plugin.wasm.new &&
        mv plugin/moon_elixir_plugin.wasm.new plugin/moon_elixir_plugin.wasm &&
        git diff --exit-code -- plugin/
    toolchain: "rust"
    inputs:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
    outputs:
      - "plugin/moon_elixir_plugin.wasm"

  test:
    description: >-
      Runs the crate's own suite. `--no-default-features` turns the `wasm`
      feature off so the inference rule compiles and runs as plain Rust; the
      integration tests then load the compiled wasm32-wasip1 artifact through
      moon's plugin test harness, which is why `build` runs first.

      Every expectation comes from tests/__fixtures__, so the suite proves the
      rule rather than this repository's present shape. It needs `elixir` on
      PATH, because the plugin asks Mix for each dependency list instead of
      parsing the manifest.
    deps:
      - "~:build"
    command: "bash"
    args:
      - "-lc"
      - >-
        export CARGO_TARGET_DIR="$HOME/.cache/baalbek-cargo-target/moon-elixir-plugin" &&
        cargo test --no-default-features
    toolchain: "rust"
    inputs:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
      - "tests/**/*"
