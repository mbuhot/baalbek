[package]
name = "moon_elixir_plugin"
version = "0.1.0"
edition = "2024"
description = "Elixir toolchain plugin for moon: infers project dependencies from mix.exs path deps."
license = "MIT"
readme = "README.md"
repository = "https://github.com/mbuhot/baalbek"
# Not published yet: seed.md:161 allows this plugin its own repository, and the
# crate is written so a copy of this directory builds and tests on its own, but
# it has no release process and no version policy while it lives here.
publish = false

[lib]
# cdylib for the wasm32-wasip1 artifact moon loads; rlib so the integration
# tests and the parser's own unit tests can link the crate natively.
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
# The plugin entry points. Off for a native `cargo test`, which exercises the
# parser and the inference rule as plain Rust.
wasm = ["dep:extism-pdk", "dep:moon_pdk"]

[dependencies]
moon_config = "2.1.2"
moon_pdk_api = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

extism-pdk = { version = "1.4.1", optional = true }
moon_pdk = { version = "2.1.1", optional = true }

[dev-dependencies]
moon_common = "2.0.8"
moon_pdk_test_utils = "2.1.1"
tokio = { version = "1.52.3", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 2
panic = "abort"
strip = true
# The profile's own `trim-paths` would belong here, but it is still unstable on
# cargo 1.98.1 (the version .prototools pins). scripts/build.sh passes
# `--remap-path-prefix` instead; the reason the artifact needs it at all is in
# that file.
