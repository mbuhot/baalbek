# Stage 2 of PLAN.md: Ash resources, schema `core` + role `core`, `boundary`,
# ExUnit. Domain: jobs, customers, sites, work orders (field service).
language: elixir
layer: library

tasks:
  test:
    description: >-
      Fetch Mix deps, bootstrap the `core` Postgres role/schema (idempotent
      — see priv/repo/bootstrap.sql), create+migrate the test database, then
      run the ExUnit suite. Elixir isn't a Moon-native toolchain yet (Stage
      11 adds moon-elixir-plugin), so this is declared as a `system` task
      that shells out to `mix`, resolved via proto's PATH activation
      (assumed already on PATH — proto/moon are set up in Stage 0).
      Requires a live Postgres (the `postgres` service in
      .devcontainer/docker-compose.yml) reachable with the connection
      details in config/config.exs / lib/mix/tasks/core.bootstrap.ex's
      defaults.
    command: "bash"
    args:
      - "-lc"
      - >-
        mix deps.get &&
        mix core.bootstrap &&
        MIX_ENV=test mix ecto.create --quiet &&
        MIX_ENV=test mix ecto.migrate --quiet &&
        MIX_ENV=test mix test
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - "config/**/*"
      - "lib/**/*"
      - "priv/**/*"
      - "spec/**/*"
      - "test/**/*"
