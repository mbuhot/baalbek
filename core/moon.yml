# Ash resources for the field-service domain: jobs, customers, sites, work
# orders.
#
# Schema `core` and role `core`. `deps`, `build`, `test` and the `bootstrap`
# this one extends come from ../.moon/tasks/elixir.yml.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/job-intake"
  - "capability/work-order-scheduling"

tasks:
  bootstrap:
    extends: "bootstrap-repo"
    # `extends` copies `internal: true` with the rest; this project opts back in.
    options:
      internal: false

  build:
    inputs:
      - "priv/**/*"

  test:
    deps:
      - "~:bootstrap"
    inputs:
      - "priv/**/*"
