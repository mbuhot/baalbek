# Stage 2 of PLAN.md: Ash resources, schema `core` + role `core`, `boundary`,
# ExUnit. Domain: jobs, customers, sites, work orders (field service).
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/job-intake"
  - "capability/work-order-scheduling"

tasks:
  build:
    description: >-
      Compiles the app into `build/`, a Moon-owned build tree separate from
      the `_build/` that Mix, ElixirLS and the `test` task share. Declared
      as this project's artefact so `server`'s tasks express their edge onto
      it as a `deps` entry that actually contributes to their hash — a task
      with no `outputs` contributes nothing. The edge rides on this task's
      declared *inputs*, not on the artefact's bytes; see
      ../spec/decisions/adr-0006-task-deps-on-output-declaring-tasks.md for the
      measurement and for why the output path carries no MIX_ENV. No
      database needed: `mix compile` never connects.
    command: "bash"
    args:
      - "-lc"
      - "mix deps.get && mix compile"
    toolchain: "system"
    # MIX_ENV is pinned because MIX_BUILD_PATH drops Mix's per-environment
    # subdirectory: without it, two environments would share one tree.
    env:
      MIX_ENV: "dev"
      MIX_BUILD_PATH: "build"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"
      - "priv/**/*"
    outputs:
      - "build/lib/core/ebin"

  test:
    description: >-
      Fetch Mix deps, bootstrap the `core` Postgres role/schema (idempotent
      — see priv/repo/bootstrap.sql), create+migrate the test database, then
      run the ExUnit suite. Elixir isn't a Moon-native toolchain yet (Stage
      11 adds moon-elixir-plugin), so this is declared as a `system` task
      that shells out to `mix`, resolved via proto's PATH activation
      (assumed already on PATH — proto/moon are set up in Stage 0).
      Requires a live Postgres (the `postgres` service in
      .devcontainer/docker-compose.yml) reachable with the connection
      details in config/config.exs / lib/mix/tasks/core.bootstrap.ex's
      defaults.
    command: "bash"
    args:
      - "-lc"
      - >-
        mix deps.get &&
        mix core.bootstrap &&
        MIX_ENV=test mix ecto.create --quiet &&
        MIX_ENV=test mix ecto.migrate --quiet &&
        MIX_ENV=test mix test
    toolchain: "system"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - "config/**/*"
      - "lib/**/*"
      - "priv/**/*"
      - "spec/**/*"
      - "test/**/*"
