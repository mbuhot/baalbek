# Stage 6 of PLAN.md: the PWA, consuming `core-api-client`'s generated
# client (seed.md §6, "Runtime edges become build-time edges").
language: typescript
layer: application

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/dispatch-board"
  - "capability/technician-work-queue"
  - "capability/field-app-delivery"
  - "capability/release-assurance"

dependsOn:
  - "core-api-client"

fileGroups:
  app:
    - "package.json"
    - "tsconfig.json"
    - "vite.config.ts"
    - "index.html"
    - "src/**/*"
    - "public/**/*"

tasks:
  lint:
    description: "Runs ESLint, whose `no-restricted-imports` rule blocks imports past core-api-client's package root (seed.md §3)."
    script: "pnpm run lint"
    deps:
      - "~:install"
    inputs:
      - "package.json"
      - "eslint.config.js"
      - "src/**/*"

  build:
    description: "Type-checks (via project references) and produces the production Vite build."
    script: "pnpm run build"
    deps:
      - "~:install"
      - "core-api-client:build"
    inputs:
      - "@group(app)"
    outputs:
      - "dist"

  test:
    description: "Runs the vitest suite against a stubbed `globalThis.fetch`."
    script: "pnpm run test"
    # `deps` on `build` is what type-checks this gate: vitest's esbuild
    # transform strips types and never runs `tsc` (spec/decisions/adr-0001-*).
    deps:
      - "~:install"
      - "core-api-client:build"
      - "lint"
      - "build"
    inputs:
      - "@group(app)"

  image:
    description: "Builds the servable PWA image e2e's stack runs: nginx serving `build`'s dist, with `server`'s API on the same origin."
    deps:
      - "build"
    command: "bash"
    args:
      - "-lc"
      - >-
        docker buildx build --builder default --load
        -f web/Dockerfile -t "${WEB_IMAGE:-baalbek-web:latest}" web
    toolchain: "system"
    # Uncached, like `server:image` and `root:sandbox-image`: an image in the
    # local docker daemon is not a file output.
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - "Dockerfile"
      - "Dockerfile.dockerignore"
      - "nginx.conf.template"
