# Stage 6 of PLAN.md: TypeScript client generated from `core`'s OpenAPI
# spec (seed.md §6, "Runtime edges become build-time edges"). The only
# generated artifact is src/generated/schema.d.ts (via openapi-typescript);
# src/index.ts is a thin hand-written wrapper (openapi-fetch) around those
# types, so a breaking API change fails `tsc`, not just a runtime request.
language: typescript

# No `layer:` (stays `unknown`) — moon's `enforceLayerRelationships`
# constraint (on by default) ignores unknown-layer projects, so this
# scopes the exemption to core-api-client's edges only, instead of
# disabling the constraint workspace-wide, for the deliberate library →
# application edge onto `server` (seed.md §6).
dependsOn:
  - "server"

tasks:
  build:
    description: >-
      Regenerates src/generated/schema.d.ts from server's published OpenAPI
      spec, then type-checks the hand-written client against it. `deps` on
      server:openapi is a *sequencing* edge only — Moon does not hash a
      dependency task's own inputs into this task's hash unless it also has
      declared `outputs` (Stage 4 lesson, pricing_native/moon.yml); server's
      openapi task does declare `outputs: [priv/static/openapi.json]`, and
      the input below additionally folds that file's content into this
      task's own hash directly, so both mechanisms agree.
    command: "bash"
    args:
      - "-lc"
      - >-
        pnpm install --frozen-lockfile &&
        pnpm run generate &&
        pnpm exec tsc --noEmit
    deps:
      - "server:openapi"
    toolchain: "node"
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/index.ts"
      # The one file this task consumes, not `project://server`. A
      # whole-project input makes Moon walk server/ while `server:release`
      # is rewriting its output tree there, which fails the run outright
      # ("Failed to read path ... No such file or directory").
      - "/server/priv/static/openapi.json"
    outputs:
      - "src/generated/schema.d.ts"
