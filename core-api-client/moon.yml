# Typed TypeScript client for `core`'s JSON:API, generated from `server`'s
# OpenAPI spec, so a breaking API change fails `tsc` rather than a request.
language: typescript

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/dispatch-board"
  - "capability/technician-work-queue"
  - "capability/api-contract"

# No `layer:`: `enforceLayerRelationships` ignores an unknown-layer project,
# which exempts this deliberate edge onto `server` without disabling the
# constraint workspace-wide.
dependsOn:
  - "server"

tasks:
  build:
    description: "Regenerates src/generated/schema.d.ts from server's published OpenAPI spec, then type-checks the client against it."
    script: "pnpm run generate && pnpm exec tsc --noEmit"
    deps:
      - "~:install"
      - "server:openapi"
    inputs:
      - "package.json"
      - "tsconfig.json"
      - "src/index.ts"
    outputs:
      - "src/generated/schema.d.ts"
