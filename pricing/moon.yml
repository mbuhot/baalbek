# Rust crate computing a field-service job quote (travel + labour + parts).
#
# The pricing -> pricing_native edge is declared as `dependsOn` on
# pricing_native's side; Mix never sees this crate.
language: rust
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/quote-pricing"

# Off the repo mount: virtiofs was observed to fail concurrent target-dir
# creation with EEXIST. pricing_native shares this directory.
env:
  CARGO_TARGET_DIR: "$HOME/.cache/baalbek-cargo-target"

tasks:
  build:
    description: "Compiles the crate and declares the resulting rlib as an output."
    # The rlib is a marker, not a hand-off: nothing reads build/libpricing.rlib.
    # See ../spec/decisions/adr-0006-task-deps-on-output-declaring-tasks.md.
    # `cat` not `cp` — `cp`'s reflink path produces NUL-filled files on virtiofs.
    script: >-
      cargo build && mkdir -p build &&
      cat "$CARGO_TARGET_DIR/debug/libpricing.rlib" > build/libpricing.rlib
    toolchain: "rust"
    inputs:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
    outputs:
      - "build/libpricing.rlib"

  test:
    description: "Runs the crate's `cargo test` suite, with no Elixir and no NIF."
    command: "cargo"
    args:
      - "test"
    toolchain: "rust"
    inputs:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
