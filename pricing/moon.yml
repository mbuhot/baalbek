# Stage 4 of PLAN.md: Rust crate computing a field-service job quote
# (travel + labour + parts). `cargo test`. Sits outside Mix's dependency
# graph; the pricing -> pricing_native edge is declared explicitly as
# dependsOn on pricing_native's side (PLAN.md "Two facades, one pattern"),
# not here and not inferred by check-deps-drift.py.
language: rust
layer: library

tasks:
  test:
    description: >-
      Run this crate's `cargo test` suite on its own — no Elixir, no NIF,
      just the plain Rust unit tests for travel/labour/parts quote
      computation. CARGO_TARGET_DIR is redirected under $HOME rather than
      left at the crate-local default: this sandbox mounts the repo over
      virtiofs, which was observed (Stage 4 development) to spuriously fail
      concurrent target-dir subdirectory creation with EEXIST; building
      instead on local (non-virtiofs) storage side-steps it and is a no-op
      relocation on any normal filesystem.
    command: "bash"
    args:
      - "-lc"
      - >-
        export CARGO_TARGET_DIR="$HOME/.cache/baalbek-cargo-target/pricing" &&
        cargo test
    toolchain: "rust"
    inputs:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
