# Runs the tasks a change affects, in one of two shapes, selected by the
# `shape` input and defaulting to `image`.
#
#   image  — `moon ci` runs inside the sandbox image, through
#            run-in-sandbox.sh. Every task sees exactly the binaries the image
#            carries (adr-0007).
#   native — `moon ci` runs on the runner, with proto's pinned toolchains and
#            the image's OS packages installed on it.
#
# Everything either shape does not select is shared, down to the `moon ci`
# invocation itself, so a run of each against one commit differs only in the
# shape. The comparison is pending; see
# spec/decisions/adr-0009-where-ci-runs-moon-ci.md.
name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  # The under-declared-input and env-drift probe: the whole graph, in the
  # image, restoring nothing. Nightly, because a stale hit on a pull request
  # is bounded by how often this runs.
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Ref to diff affected tasks against. Empty uses moon's own default, which is the whole graph."
        required: false
        default: ""
      shape:
        description: "Where moon ci runs."
        required: false
        default: "image"
        type: choice
        options:
          - "image"
          - "native"

concurrency:
  group: "ci-${{ github.ref }}-${{ inputs.shape || 'image' }}"
  cancel-in-progress: true

# An unlisted scope is `none`, so `packages: read` has to be named even though
# the repository's default workflow permission is already read.
permissions:
  contents: read
  packages: read

jobs:
  moon-ci:
    runs-on: ubuntu-latest
    # Still sized for a cold run: `main` restores no task output, and whenever
    # no published image matches this tree the sandbox image compiles
    # Erlang/OTP from source.
    timeout-minutes: 180

    env:
      SHAPE: ${{ inputs.shape || 'image' }}
      # `.moon/cache` is a symlink to this in both shapes, so every step that
      # touches moon's cache is shape-independent. run-in-sandbox.sh reads the
      # variable too, and then mounts this path at itself.
      SANDBOX_MOON_CACHE: /tmp/baalbek-sandbox-moon-cache
      # Prefixed onto each moon invocation. Empty in the native shape, where
      # the unquoted expansion vanishes and leaves the bare command. The
      # non-empty value must sit in the true branch: `''` is falsy, so
      # `cond && '' || x` yields `x` for both values of cond.
      RUN_PREFIX: ${{ (inputs.shape || 'image') == 'image' && '.github/scripts/run-in-sandbox.sh' || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # `moon ci` diffs against a base ref and `explorer:generate` reads git
          # history for its change-frequency overlay. Neither survives a
          # shallow clone.
          fetch-depth: 0

      - name: Report the shape
        run: echo "shape=$SHAPE, moon prefix='${RUN_PREFIX}'" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        # The sandbox image is over 4 GB before it compiles anything, and the
        # release image, the OTP build tree and node_modules land on top of it.
        # The preinstalled Android, .NET and Haskell trees are the cheapest tens
        # of gigabytes to give back.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Start Postgres
        # The devcontainer's own service definition, so the version, the
        # credentials and the healthcheck exist once. That file is also one of
        # moon's implicit inputs, which is what makes a Postgres bump
        # invalidate every cached test result instead of replaying results
        # proven against the old server.
        run: docker compose -p baalbek-ci -f .devcontainer/docker-compose.yml up -d --wait postgres

      - name: Resolve the affected base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="origin/$PR_BASE" ;;
            workflow_dispatch) base="$DISPATCH_BASE" ;;
            # The nightly probe runs the whole graph from a cold cache.
            schedule) base="$(git rev-list --max-parents=0 HEAD | head -1)" ;;
            *) base="$PUSH_BEFORE" ;;
          esac
          # A new branch or a force-push reports an all-zero "before". Moon's
          # own default is better than a ref that resolves to nothing.
          if [ -n "$base" ] && ! git rev-parse --verify --quiet "${base}^{commit}" > /dev/null; then
            echo "base '$base' is not a commit in this clone; using moon's default"
            base=""
          fi
          echo "affected base: ${base:-<moon default>}"
          [ -z "$base" ] || echo "MOON_BASE=$base" >> "$GITHUB_ENV"

      - name: Point moon's cache at the shared host directory
        # One host path in both shapes: the native shape writes through this
        # symlink, and run-in-sandbox.sh resolves it and mounts the target at
        # the same absolute path inside the container.
        run: |
          mkdir -p "$SANDBOX_MOON_CACHE" .moon
          ln -sfn "$SANDBOX_MOON_CACHE" .moon/cache
          ls -l .moon/cache

      - name: Install the OS packages the sandbox image has
        if: env.SHAPE == 'native'
        # The same script the image's two apt layers run.
        run: scripts/install-os-deps.sh all

      - name: Put proto on the login-shell PATH
        if: env.SHAPE == 'native'
        # /etc/profile resets PATH, and proto's shims cannot locate `erl`,
        # `elixir` or `mix`; only `bin` can, and only `shims` has pnpm.
        run: |
          sudo tee /etc/profile.d/proto.sh > /dev/null <<'PROFILE'
          export PROTO_HOME="$HOME/.proto"
          export PATH="$PROTO_HOME/bin:$PATH:$PROTO_HOME/shims"
          PROFILE
          sudo chmod +r /etc/profile.d/proto.sh

      - name: Install the pinned toolchains
        if: env.SHAPE == 'native'
        # Caches ~/.proto, so Erlang/OTP builds once per pin change.
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install hex and rebar
        if: env.SHAPE == 'native'
        # Mix ships neither, and the image bakes them in.
        run: bash -lc 'mix local.hex --force && mix local.rebar --force'

      - name: Restore toolchain downloads, on the runner
        if: env.SHAPE == 'native'
        # Downloads and third-party build state only, never a task output.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pnpm
            ~/.cache/gleam
            ~/.cache/baalbek-cargo-target
            ~/.cache/baalbek-gradle/caches/modules-2
            ~/.cache/baalbek-gradle/wrapper
            ~/.cargo/registry
            ~/.hex
            ~/.mix
            ~/.android-sdk
          key: "downloads-native-${{ runner.os }}-${{ hashFiles('.prototools', 'pnpm-lock.yaml', 'e2e/package.json', 'mobile/scripts/setup-android-sdk.sh', '**/Cargo.lock', '**/mix.lock') }}"
          restore-keys: "downloads-native-${{ runner.os }}-"

      - name: Restore toolchain downloads, for the image
        if: env.SHAPE == 'image'
        # The four directories run-in-sandbox.sh mounts into the container.
        # None of them is a task output.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/baalbek-sandbox/cache
            ~/.cache/baalbek-sandbox/android-sdk
            ~/.cache/baalbek-sandbox/cargo-registry
            ~/.cache/baalbek-sandbox/hex
          key: "downloads-image-${{ runner.os }}-${{ hashFiles('.prototools', 'pnpm-lock.yaml', 'e2e/package.json', 'mobile/scripts/setup-android-sdk.sh', '**/Cargo.lock', '**/mix.lock') }}"
          restore-keys: "downloads-image-${{ runner.os }}-"

      - name: Restore first-party build outputs
        # Pull requests only, and restore-only. `main` writes every entry and
        # reads none, so this can only ever replay what a cold `main` run built.
        #
        # The shape is part of the key: the two shapes compile against
        # different libc, and replaying one shape's output into the other is
        # how a green run ships a broken artifact.
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SANDBOX_MOON_CACHE }}
          key: "moon-outputs-${{ env.SHAPE }}-${{ github.event.pull_request.base.sha }}"
          restore-keys: "moon-outputs-${{ env.SHAPE }}-"

      - name: Drop the restored run reports
        # Or an aborted run uploads `main`'s report as its own.
        if: github.event_name == 'pull_request'
        run: rm -f "$SANDBOX_MOON_CACHE/ciReport.json" "$SANDBOX_MOON_CACHE/runReport.json"

      - name: Log in to GHCR
        # Skipped for a fork PR, whose token has no `packages` scope, so that
        # branch takes the cold path by construction. Everywhere else a failed
        # login is a real regression and fails the job, rather than hiding as
        # a run that is merely slow.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Resolve the sandbox image
        # Builds the current Dockerfile with the published image as a cache
        # source, rather than running a pulled image that could be older than
        # the tree. The image shape always needs it; the native shape needs it
        # only when the affected tasks reach `root:sandbox-image`.
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # The same override sandbox-image.yml publishes to.
          SANDBOX_IMAGE_REPO: ${{ vars.SANDBOX_IMAGE_REPO }}
        run: |
          if [ "$SHAPE" = "image" ] || .github/scripts/affected-needs-sandbox-image.sh; then
            .github/scripts/resolve-sandbox-image.sh
          else
            echo "sandbox image: not affected by this change, so it is not built here"
          fi

      - name: Hand the workspace and the mounted caches to the image's user
        if: env.SHAPE == 'image'
        # The image runs as `vscode`, uid 1000; a runner checkout is uid 1001.
        # Every host path run-in-sandbox.sh mounts has to be created here, so
        # that this one chown covers all of them.
        run: |
          mkdir -p \
            ~/.cache/baalbek-sandbox/cache \
            ~/.cache/baalbek-sandbox/android-sdk \
            ~/.cache/baalbek-sandbox/cargo-registry \
            ~/.cache/baalbek-sandbox/hex \
            "$SANDBOX_MOON_CACHE"
          sudo chown -R 1000:1000 \
            "$GITHUB_WORKSPACE" \
            ~/.cache/baalbek-sandbox \
            "$SANDBOX_MOON_CACHE"

      - name: Report the tasks this environment cannot run
        # Unquoted on purpose: an empty RUN_PREFIX has to disappear.
        run: $RUN_PREFIX bash .github/scripts/report-excluded-tasks.sh

      - name: moon ci
        # `--downstream deep` because moon's default is `none`, which runs a
        # changed project's own tasks and never its consumers'. Without it a
        # Rust change to `pricing_native` does not run `server:test`, and an
        # API change does not build `core-api-client`.
        run: $RUN_PREFIX moon ci --summary detailed --downstream deep

      - name: Summarize what this run did
        if: always()
        run: bash .github/scripts/summarize-ci-report.sh "$SANDBOX_MOON_CACHE/ciReport.json"

      - name: Save first-party build outputs
        # `main` only, and the sole writer of this cache. `always()` because a
        # run with one failing task still built every other output, and without
        # it one red task leaves every pull request nothing to restore.
        # A dispatch on `main` writes too, so the cache can be seeded from a
        # whole-graph run instead of waiting for a commit that touches
        # everything.
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SANDBOX_MOON_CACHE }}
          key: "moon-outputs-${{ env.SHAPE }}-${{ github.sha }}"

      - name: Upload moon's CI report
        # From the mount's host path, not `.moon/cache`: in the image shape the
        # container writes through the mount, which would leave an
        # in-workspace mountpoint empty.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "moon-ci-report-${{ env.SHAPE }}"
          path: ${{ env.SANDBOX_MOON_CACHE }}/ciReport.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the Playwright report
        # `ignore`: this exists only when `e2e:test` was affected.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "playwright-report-${{ env.SHAPE }}"
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
