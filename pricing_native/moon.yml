# Elixir Rustler NIF facade for the `pricing` crate.
#
# `boundary` enforces that PricingNative.Native, the raw NIF module, is
# reachable only from PricingNative. Rustler compiles native/pricingnative
# during `mix compile` and Mix's manifest does not track it, so each task
# below declares that directory itself. The .so Rustler writes into
# priv/native is deliberately not an output; adr-0006 says why.
language: elixir
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/quote-pricing"

# Hand-declared: the crate edge is a Cargo path dependency in
# native/pricingnative/Cargo.toml, which Mix never sees.
dependsOn:
  - "pricing"

tasks:
  build:
    inputs:
      - "native/**/*"

  test:
    inputs:
      - "native/**/*"
