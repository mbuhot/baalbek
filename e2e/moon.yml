# Playwright against the containerised `MIX_ENV=prod` release, never a dev
# server. See spec/decisions/adr-0001-dockerized-e2e-stack.md.
language: typescript
layer: automation

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/release-assurance"

dependsOn:
  - "server"
  - "web"

# `web` is a dependency of the *stack*, not of this project's TypeScript: this
# suite imports nothing from it, and `web`'s tsconfig is `noEmit` and not
# `composite`, so a synced project reference is one `tsc` refuses to compile.
toolchains:
  typescript:
    syncProjectReferences: false

fileGroups:
  suite:
    - "package.json"
    - "tsconfig.json"
    - "playwright.config.ts"
    - "stack.ts"
    - "tests/**/*"

tasks:
  list:
    description: "Writes the resolved test list, with each test's `@capability/<id>` tags, to build/test-list.json."
    # The JSON goes to a file through PLAYWRIGHT_JSON_OUTPUT_NAME, not through
    # stdout: pnpm prepends its own NDJSON banner in an agent environment.
    script: "pnpm exec playwright test --list --reporter=json"
    deps:
      - "~:install"
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: "build/test-list.json"
    inputs:
      - "@group(suite)"
    outputs:
      - "build/test-list.json"

  test:
    description: "Runs the Playwright suite against docker-compose.yml's stack: the `baalbek-server` and `baalbek-web` images and their own Postgres."
    script: "pnpm run typecheck && pnpm run browsers && pnpm run test"
    deps:
      - "~:install"
      - "server:image"
      - "web:image"
    # Uncached: both image `deps` declare no outputs, so the stack under test
    # is outside this task's hash and a cache hit would replay a stale pass.
    options:
      cache: false
    inputs:
      - "@group(suite)"
      - "global-setup.ts"
      - "global-teardown.ts"
      - "docker-compose.yml"
      - "bootstrap.exs"
