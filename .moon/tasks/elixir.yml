# Tasks inherited by every project whose `language` is `elixir`.
# https://moonrepo.dev/docs/config/tasks
#
# `inheritedBy` is required: moon 2.5.4 applies a conditionless
# `.moon/tasks/*.yml` to every project. A project declaration merges into these,
# it does not replace them.
# See ../../spec/decisions/adr-0010-third-party-deps-compile-in-their-own-task.md.
#
# Every `mix` task runs under `bash -lc`. Only a login shell puts
# `$PROTO_HOME/bin` ahead of `$PROTO_HOME/shims`, and the shim for an
# asdf-backed Erlang cannot locate its executable (../../spec/decisions/adr-0009-*).
inheritedBy:
  language: "elixir"

tasks:
  deps-list:
    description: "Carries `$MIX_THIRD_PARTY_DEPS`, the locked dependency names moon-elixir-plugin reads from Mix."
    # Declared so `extends` resolves when the plugin delivers nothing.
    command: "noop"

  deps:
    description: "Fetches and compiles the third-party dependency tree into `deps/`, `build/dev` and `build/test`."
    extends: "deps-list"
    command: "bash"
    args:
      - "-lc"
      - >-
        test -n "$MIX_THIRD_PARTY_DEPS" ||
        { echo "$project:deps: no dependency list from the elixir toolchain plugin; fetching sources only" >&2; mix deps.get; exit; };
        mix deps.get &&
        mix deps.compile $MIX_THIRD_PARTY_DEPS &&
        MIX_ENV=test MIX_BUILD_PATH=build/test mix deps.compile $MIX_THIRD_PARTY_DEPS
    toolchain: "system"
    # MIX_ENV is pinned: MIX_BUILD_PATH drops Mix's own `<env>` path segment.
    env:
      MIX_ENV: "dev"
      MIX_BUILD_PATH: "build/dev"
    inputs:
      - "mix.exs"
      - "mix.lock"
    # `build` and `test` own this project's own code in both trees.
    outputs:
      - "deps/**/*"
      - "build/dev/lib/**/*"
      - "!build/dev/lib/$project/**/*"
      - "build/test/lib/**/*"
      - "!build/test/lib/$project/**/*"

  build:
    description: "Compiles this app's own code into `build/dev`, this project's declared artefact."
    # `^:build` is every depended-on project, skipping in silence any whose
    # artefact task is not named `build`.
    deps:
      - "~:deps"
      - "^:build"
    command: "bash"
    args:
      - "-lc"
      - "mix compile"
    toolchain: "system"
    env:
      MIX_ENV: "dev"
      MIX_BUILD_PATH: "build/dev"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - "config/**/*"
      - "lib/**/*"
    outputs:
      - "build/dev/lib/$project/ebin"

  test:
    description: "Runs the ExUnit suite at `MIX_ENV=test`, in `deps`' test build tree."
    deps:
      - "~:deps"
      - "^:build"
    command: "bash"
    args:
      - "-lc"
      - "mix test"
    toolchain: "system"
    env:
      MIX_ENV: "test"
      MIX_BUILD_PATH: "build/test"
    inputs:
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - "config/**/*"
      - "lib/**/*"
      - "spec/**/*"
      - "test/**/*"
