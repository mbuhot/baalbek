# Moon toolchain configuration.
# https://moonrepo.dev/docs/config/toolchain
#
# Stage 1 of PLAN.md ("Toolchain: proto owns everything"): enable node,
# pnpm, typescript, rust, and system. versionFromPrototools: true on every
# toolchain that supports it, so Moon reads versions from the root
# .prototools instead of duplicating them here.
#
# Stage 11 adds the custom `elixir` toolchain at the bottom of this file.
# Gleam and Capacitor projects still fall back to `system`.
node:
  versionFromPrototools: true

pnpm:
  versionFromPrototools: true

# syncProjectReferences (default true) was set to false earlier in Stage 6 —
# re-tested (moon check --all against a clean cache, several times) after the
# tsconfig.base.json move to config/tsconfig.base.json, and it's no longer
# needed either way: `web` and `core-api-client` hand-maintain their own
# tsconfig.json `references`, and there's still no workspace-root
# tsconfig.json for Moon's auto-sync to fight over (config/tsconfig.base.json
# is a shared base, not a root project config). Left at its default.
typescript:
  versionFromPrototools: true

rust:
  versionFromPrototools: true

system: {}

# Stage 11 of PLAN.md: moon-elixir-plugin, which asks Mix for each Elixir
# project's dependency list and infers the `dependsOn` between them. It runs
# one `elixir` process while the project graph is built, and manages no
# versions; see
# ../moon-elixir-plugin/spec/decisions/adr-0001-mix-path-dep-inference.md.
#
# The plugin is loaded from a committed artifact, not from
# moon-elixir-plugin/build/: moon reads the WASM file while building the
# project graph, so a missing file fails every moon command, including the
# `moon run moon-elixir-plugin:build` that would produce it.
elixir:
  plugin: "file://../moon-elixir-plugin/plugin/moon_elixir_plugin.wasm"

  # `asdf:elixir`, not `true`: `true` looks up the toolchain's own id, and
  # this workspace has no plain `elixir` entry in .prototools (proto resolves
  # Elixir through its asdf backend). Measured as inert either way today —
  # every Elixir task declares `toolchain: "system"`, so the resolved version
  # does not reach their hashes. Named correctly so it starts working if this
  # plugin ever grows tier-2 dependency installs.
  versionFromPrototools: "asdf:elixir"
