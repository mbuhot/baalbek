# Moon toolchain configuration.
# https://moonrepo.dev/docs/config/toolchain
#
# Stage 1 of PLAN.md ("Toolchain: proto owns everything"): enable node,
# pnpm, typescript, rust, and system. versionFromPrototools: true on every
# toolchain that supports it, so Moon reads versions from the root
# .prototools instead of duplicating them here.
#
# Deliberately NOT enabled yet: a custom Elixir toolchain (PLAN.md says that
# arrives in Stage 11 as moon-elixir-plugin). Elixir, Gleam, and Capacitor
# projects fall back to the `system` toolchain until then — fine, since none
# of them have real tasks at Stage 1.
node:
  versionFromPrototools: true

pnpm:
  versionFromPrototools: true

# syncProjectReferences (default true) was set to false earlier in Stage 6 —
# re-tested (moon check --all against a clean cache, several times) after the
# tsconfig.base.json move to config/tsconfig.base.json, and it's no longer
# needed either way: `web` and `core-api-client` hand-maintain their own
# tsconfig.json `references`, and there's still no workspace-root
# tsconfig.json for Moon's auto-sync to fight over (config/tsconfig.base.json
# is a shared base, not a root project config). Left at its default.
typescript:
  versionFromPrototools: true

rust:
  versionFromPrototools: true

system: {}
