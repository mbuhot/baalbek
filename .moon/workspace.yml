# Moon workspace configuration.
# https://moonrepo.dev/docs/config/workspace
#
# Stage 1 of PLAN.md: register the 14 components from the Stage 0 skeleton,
# plus a "root" pseudo-project (source ".") that owns repo-wide tooling —
# currently just the dependsOn drift-check task (seed.md §2 fallback).
#
# NOTE: `root` is a 15th project not listed in PLAN.md's Component inventory
# table. It exists purely so Moon has somewhere to hang the drift-check task;
# `moon check --all` errors out (app::tty::required_id, observed against moon
# 2.5.4 in this sandbox) when the whole workspace has zero tasks, which would
# otherwise be the case until Stage 2 adds core's first real task. See
# check-deps-drift.py's header comment and the Stage 1 report for detail.
projects:
  sources:
    root: "."
  globs:
    - "*"

vcs:
  defaultBranch: "main"
  provider: "github"

# Two source globs in this workspace straddle a build tree they cannot
# exclude themselves: `pricing_native`'s `native/**/*` covers the NIF crate
# and its in-tree `target/` (39 files), and `mobile`'s `android/**/*` covers
# the Gradle project and the `build/outputs/` directory that task writes its
# own APK into. The five other patterns this list carried are gone with the
# `project://` inputs that made them necessary — no declared input glob
# reaches `_build/`, `deps/`, `node_modules/`, `dist/` or `priv/native/` any
# more. This is input-side only: a declared `output` under one of these
# paths is still archived and restored normally, which is what lets every
# project's artefact live in `<project>/build/`.
# See spec/decisions/adr-0006-task-deps-on-output-declaring-tasks.md.
hasher:
  ignorePatterns:
    - "**/build/**"
    - "**/target/**"
