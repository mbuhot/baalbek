# Event-sourced technician timeline (Gleam). No Gleam toolchain plugin
# exists for Moon yet, so this is a system task, same as other
# non-first-party projects here.
language: gleam
layer: library

tasks:
  test:
    description: >-
      Bootstraps the timeline Postgres role/schema/tables (idempotent),
      then runs the Gleam test suite. Requires a live Postgres (the
      postgres service in .devcontainer/docker-compose.yml).
    command: "bash"
    args:
      - "scripts/moon-test.sh"
    toolchain: "system"
    inputs:
      - "gleam.toml"
      - "manifest.toml"
      - "src/**/*"
      - "test/**/*"
      - "scripts/moon-test.sh"
