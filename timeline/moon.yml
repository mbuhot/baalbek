# Event-sourced technician timeline (Gleam). No Gleam toolchain plugin
# exists for Moon yet, so this is a system task, same as other
# non-first-party projects here.
language: gleam
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/technician-availability"

tasks:
  deps:
    description: >-
      Downloads the third-party Gleam packages into `build/packages`. Keyed on
      `gleam.toml` and `manifest.toml` alone, so no change under `src/`
      invalidates it.
    command: "bash"
    args:
      - "scripts/deps-download.sh"
    toolchain: "system"
    inputs:
      - "gleam.toml"
      - "manifest.toml"
      - "scripts/deps-download.sh"
      - "scripts/toolchain-path.sh"
    outputs:
      - "build/packages/**/*"

  bootstrap:
    description: >-
      Creates the timeline Postgres role, schema and tables (idempotent).
      Never cached: a warm Moon cache and a fresh database is a real
      combination (a new container, a dropped schema, CI's first run
      against a new Postgres), and a cache hit here would skip the one
      thing every timeline-touching task needs to have happened. This is
      why `core`/`identity`/`billing` run their own `mix *.bootstrap`
      unconditionally inside each task's command line.
    command: "bash"
    args:
      - "scripts/bootstrap.sh"
    toolchain: "system"
    options:
      cache: false

  test:
    description: >-
      Runs the Gleam test suite against the real timeline schema. Requires
      a live Postgres (the postgres service in
      .devcontainer/docker-compose.yml).
    deps:
      - "~:deps"
      - "~:bootstrap"
    command: "bash"
    args:
      - "scripts/moon-test.sh"
    toolchain: "system"
    inputs:
      - "gleam.toml"
      - "manifest.toml"
      - "src/**/*"
      - "test/**/*"
      - "scripts/moon-test.sh"
      - "scripts/toolchain-path.sh"

  build:
    description: >-
      Builds build/otp/ — this project and its runtime dependencies as
      ordinary OTP application directories, with real {modules, ...} lists.
      `timeline_facade`'s mix.exs takes one Mix path dependency per
      directory, which is what puts the Gleam code inside `server`'s
      release. See ../server/spec/decisions/adr-0001-release-assembly-and-gleam-packaging.md.
      No database needed: this compiles and copies only.
    deps:
      - "~:deps"
    command: "bash"
    args:
      - "scripts/package-otp.sh"
    toolchain: "system"
    inputs:
      - "gleam.toml"
      - "manifest.toml"
      - "src/**/*"
      - "scripts/package-otp.sh"
      - "scripts/otp-closure.escript"
      - "scripts/toolchain-path.sh"
    outputs:
      - "build/otp"
