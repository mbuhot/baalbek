# Event-sourced technician timeline (Gleam).
#
# Every task runs under `bash -lc`: only a login shell puts $PROTO_HOME/bin
# ahead of proto's shims, and the shim for an asdf-backed Erlang cannot locate
# its executable (../spec/decisions/adr-0009-where-ci-runs-moon-ci.md).
language: gleam
layer: library

# Capabilities this component serves, in explorer/capabilities.yml's vocabulary.
tags:
  - "capability/technician-availability"

fileGroups:
  # The package set every task resolves against.
  manifest:
    - "gleam.toml"
    - "manifest.toml"
  # This project's own modules.
  sources:
    - "src/**/*"

tasks:
  deps:
    description: "Downloads the third-party Gleam packages into `build/packages`."
    command: "bash"
    args:
      - "-lc"
      - "gleam deps download"
    inputs:
      - "@group(manifest)"
    outputs:
      - "build/packages/**/*"

  bootstrap:
    description: "Creates the timeline Postgres role, schema and tables (idempotent)."
    command: "bash"
    args:
      - "-lc"
      - "gleam run -m timeline/bootstrap"
    options:
      # A warm Moon cache against a fresh database is a real combination, and a
      # cache hit here would skip the schema every timeline task needs.
      cache: false

  test:
    description: "Runs the Gleam test suite against the real timeline schema."
    deps:
      - "~:deps"
      - "~:bootstrap"
    command: "bash"
    args:
      - "-lc"
      - "gleam test"
    inputs:
      - "@group(manifest)"
      - "@group(sources)"
      - "test/**/*"

  build:
    description: "Builds this project and its runtime deps into `build/otp` as OTP application directories."
    # Named `build`, not `package`, so the inherited `^:build` edge reaches it.
    # See ../server/spec/decisions/adr-0001-release-assembly-and-gleam-packaging.md.
    deps:
      - "~:deps"
    command: "bash"
    args:
      - "-lc"
      - "bash scripts/package-otp.sh"
    inputs:
      - "@group(manifest)"
      - "@group(sources)"
      - "scripts/package-otp.sh"
      - "scripts/otp-closure.escript"
    outputs:
      - "build/otp"
